<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word TXT Çevirme | Fluxora</title>
    <meta name="description" content="Word (DOCX) belgelerini düz metin dosyasına çevirin.">

    <!-- Hreflang Tags -->
    <link rel="alternate" hreflang="en" href="/en/word-to-txt" />
    <link rel="alternate" hreflang="tr" href="/tr/word-txt-cevirme" />

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/animations.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {}
    </script>
</head>

<body class="dark-theme">
    <header class="navbar glass">
        <div class="logo">
            <a href="/tr/">
                <img src="/assets/img/fluxora_logo.png" alt="Fluxora Logo"
                    style="height: 40px; vertical-align: middle;">
            </a>
        </div>
        <nav>
            <div class="lang-switch">
                <a href="/en/word-to-txt" class="btn-sm">EN</a>
            </div>
            <!-- Internal links can go here or in hamburger -->
        </nav>
    </header>

    <main id="app">
        <!-- SEO Content Area -->
        <article style="max-width: 800px; margin: 60px auto 0; text-align: left; color: var(--text-muted);">
            {{ content }}

            <hr style="border:0; border-top:1px solid var(--border); margin: 40px 0;">

            <!-- Auto-Generated Rich Content -->
            <section class="seo-rich-content">
                <h3>{{ faq_title }}</h3>
                <div class="faq-item">
                    <strong>{{ faq_q1 }}</strong>
                    <p>{{ faq_a1 }}</p>
                </div>
                <div class="faq-item">
                    <strong>{{ faq_q2 }}</strong>
                    <p>{{ faq_a2 }}</p>
                </div>
            </section>
        </article>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Fluxora. Built by <span class="sys-id">SYS_0xA7</span>.</p>
            <div class="footer-links">
                <a href="/tr/about">About</a>
                <a href="/tr/privacy">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Core Scripts -->
    <script type="module" src="/assets/js/main.js"></script>
    <script src="/assets/js/tools/document-logic.js"></script>
</body>

</html>
