<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    
    <!-- Hreflang Tags -->
    {{hreflang_tags}}

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/animations.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- JSON-LD -->
    <script type="application/ld+json">
    {{json_ld}}
    </script>
</head>
<body class="dark-theme">
    <header class="navbar glass">
        <div class="logo">
            <a href="/{{lang}}/">Fluxora<span class="accent">.</span></a>
        </div>
        <nav>
            <div class="lang-switch">
                <a href="{{switch_lang_url}}" class="btn-sm">{{switch_lang_label}}</a>
            </div>
            <!-- Internal links can go here or in hamburger -->
        </nav>
    </header>

    <main id="app">
        {{content}}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Fluxora. Built by <span class="sys-id">SYS_0xA7</span>.</p>
            <div class="footer-links">
                <a href="/{{lang}}/about">About</a>
                <a href="/{{lang}}/privacy">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Core Scripts -->
    <script type="module" src="/assets/js/main.js"></script>
    {{extra_scripts}}
</body>
</html>
